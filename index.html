<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>VEILBORN — Descent. Rise. Rewrite.</title>

  <!-- iOS PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Veilborn" />
  <meta name="theme-color" content="#090a10" />
  <meta name="description" content="VEILBORN — a 2D action-roguelike. Descend five realms, break five bosses, and decide what the Veil remembers." />

  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icons/icon-180.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />

  <!-- iOS launch screens (avoid the white flash on Add to Home Screen). -->
  <link rel="apple-touch-startup-image" href="/splash/splash-1170x2532.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)" />
  <link rel="apple-touch-startup-image" href="/splash/splash-1284x2778.png" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3)" />
  <link rel="apple-touch-startup-image" href="/splash/splash-1179x2556.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)" />
  <link rel="apple-touch-startup-image" href="/splash/splash-1290x2796.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)" />
  <link rel="apple-touch-startup-image" href="/splash/splash-1242x2688.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3)" />
  <link rel="apple-touch-startup-image" href="/splash/splash-750x1334.png" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2)" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #090a10;
      overflow: hidden;
      width: 100%;
      height: 100%;
      /* iOS: no rubber-band scrolling and no long-press callout while playing */
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    #game {
      width: 100%;
      height: 100%;
      display: block;
      /* Respect the iPhone notch / home indicator. */
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      box-sizing: border-box;
    }
    #game canvas { display: block; touch-action: none; }
    #boot-notice {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #aaa4bd; font-family: Georgia, serif; font-size: 16px; pointer-events: none;
    }

    /* Rotate prompt. The arena is a 16:9 field, so a portrait phone would
       letterbox it into an unplayable strip. Shown only on touch devices in
       portrait (see pwa.js), and never on desktop where the window is wide. */
    #rotate {
      position: fixed; inset: 0; z-index: 50; display: none;
      flex-direction: column; align-items: center; justify-content: center; gap: 26px;
      background: radial-gradient(circle at 50% 40%, #1a1430 0%, #090a10 70%);
      color: #e8e2f5; font-family: Georgia, serif; text-align: center;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      box-sizing: border-box;
    }
    #rotate.show { display: flex; }
    #rotate svg { width: 96px; height: 96px; animation: tilt 2.2s ease-in-out infinite; }
    #rotate .title { font-size: 22px; letter-spacing: 0.14em; }
    #rotate .hint { font-size: 15px; color: #aaa4bd; max-width: 260px; line-height: 1.5; }
    @keyframes tilt {
      0%, 45% { transform: rotate(0deg); }
      70%, 100% { transform: rotate(-90deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      #rotate svg { animation: none; transform: rotate(-90deg); }
    }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="rotate" role="status" aria-live="polite">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">
      <rect x="7" y="2" width="10" height="20" rx="2" />
      <line x1="10.5" y1="19" x2="13.5" y2="19" stroke-linecap="round" />
      <path d="M4 8a9 9 0 0 1 2-4" stroke-linecap="round" />
      <path d="M2.6 6.2 4 8l1.9-1.2" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
    <div class="title">ROTATE YOUR PHONE</div>
    <div class="hint">VEILBORN plays in landscape. Turn your device sideways to enter the Veil.</div>
  </div>
  <div id="boot-notice">VEILBORN</div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
